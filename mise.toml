[tools]
"aqua:neovim/neovim" = "0.11.5"
stylua = "2.6.0"
markdownlint-cli2 = "0.24.0"
node = "24"
jactionlint = "2.3.0"
shellcheck = "0.11.0"
shfmt = "3.12.0"

[tasks.lint]
run = ["stylua --check lua plugin tests", "markdownlint-cli2 '**/*.md'", "jactionlint .github/workflows/check.yml", "shellcheck tests/run.sh", "shfmt -d -i 2 tests/run.sh", "bash -n tests/run.sh"]

[tasks.test]
run = ["bash tests/run.sh", "NVIM_AI_COMMIT_TEST=1 NVIM_LOG_FILE=/tmp/ai-commitplan-http.log nvim --headless -u NONE -i NONE -l tests/ai-commit-http.lua"]

[tasks.check]
depends = ["lint", "test"]

[tasks.ci-list]
description = "List GitHub Actions jobs locally without starting containers"
run = "act --list -W .github/workflows/check.yml"

[tasks.ci-local]
description = "Run the Linux CI job using act and a running Docker engine"
run = '''act workflow_dispatch --job check --matrix os:ubuntu-latest --matrix "neovim:${AI_COMMITPLAN_NVIM_VERSION:-0.12.6}" --container-daemon-socket - -P ubuntu-latest=ghcr.io/catthehacker/ubuntu:act-latest'''
